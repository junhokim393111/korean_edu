<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리나라 지리와 함께 탐구하는 우리말 문법 현상</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#E6E9ED; --panel:#F4F6F8; --map:#BFC5CC; --map-side:#8E98A3; --map-line:#E9EDF1;
  --dim:#D2D7DC; --dim-side:#B3BAC2;
  --sky:#5BC0EB; --sky-d:#2A8FC0; --sky-l:#E3F4FC;
  --green:#4CAF7D; --green-d:#2F8A5B; --green-l:#E5F4EC;
  --white:#FFFFFF; --ink:#262C33; --ink2:#56606B; --line:#D3D9DF;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--white);
  border-bottom:4px solid var(--sky)}
.logo{width:44px;height:44px;flex:none;border-radius:12px;background:var(--green);display:grid;place-items:center}
.logo svg{width:28px;height:28px;color:#fff}
header h1{margin:0;font-size:clamp(19px,2.2vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.3}
header p{margin:2px 0 0;color:var(--ink2);font-size:15px}

/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.mapcol{display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{position:relative;flex:1;min-height:520px;overflow:hidden;touch-action:manipulation}
#map,#overlay{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{pointer-events:none}
#cards{position:absolute;inset:0;pointer-events:none}
#cardList{display:none}
aside.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel-scroll{overflow:auto;flex:1;padding:22px 22px 28px}

@media (max-width:980px){
  main{grid-template-columns:1fr;grid-template-rows:auto auto}
  #stage{flex:none;height:64vh;min-height:420px}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  .panel-scroll{overflow:visible}
  main{flex:none}
  .mapcol{min-height:auto}
}

/* ---------- map ---------- */
.region{cursor:pointer;outline:none}
.region .top{transition:transform .3s ease}
.region .top path{fill:var(--map);stroke:var(--map-line);stroke-width:.6;stroke-linejoin:round;
  vector-effect:non-scaling-stroke;transition:fill .3s ease}
.region .base path{fill:var(--map-side);stroke:none}
.region .hit{fill:transparent;stroke:none}
.region.lift .top{filter:url(#lift-shadow)}
.region.lift .top path{fill:var(--sky)}
.region.lift .base path{fill:var(--sky-d)}
.region:focus-visible .top path{stroke:var(--green-d);stroke-width:2}
#map.zoomed .region .top path{fill:var(--dim)}
#map.zoomed .region .base path{fill:var(--dim-side)}
#map.zoomed .region.active .top path{fill:var(--sky)}
#map.zoomed .region.active .base path{fill:var(--sky-d)}
#map.zoomed .region:not(.active):hover .top path{fill:#C6E7F6}
.dokdo{fill:var(--map);stroke:var(--map-side);stroke-width:.6;vector-effect:non-scaling-stroke}
.region.lift .dokdo,#map.zoomed .region.active .dokdo{fill:var(--sky);stroke:var(--sky-d)}
#labels text{font-family:var(--font);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.9);
  stroke-width:4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none;transition:opacity .3s}
#labels text.small{font-weight:600;fill:var(--ink2)}
#map.zoomed #labels .rlabel{opacity:0}

/* ---------- overlay: markers & leader lines ---------- */
.leader{stroke:var(--sky-d);stroke-width:2;fill:none;opacity:.9}
.leader-dot{fill:var(--sky-d)}
.marker{pointer-events:all;cursor:pointer}
.marker circle.m{fill:var(--white);stroke:var(--sky-d);stroke-width:3;transition:r .2s}
.marker text{font-family:var(--font);font-size:12px;font-weight:800;fill:var(--sky-d);text-anchor:middle;dominant-baseline:central}
.marker .mname{font-size:14px;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;text-anchor:start}
.marker:hover circle.m,.marker.hl circle.m{fill:var(--green);stroke:var(--green-d)}
.marker:hover text.n,.marker.hl text.n{fill:#fff}
.marker .pulse{fill:none;stroke:var(--green);stroke-width:3;opacity:0}
.marker.hl .pulse{animation:pulse 1.4s ease-out 3}
@keyframes pulse{0%{r:12;opacity:.9}100%{r:34;opacity:0}}

/* ---------- top bar on stage ---------- */
.stagebar{position:absolute;left:16px;top:14px;right:16px;display:flex;gap:10px;align-items:center;pointer-events:none;z-index:5}
.btn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;
  background:var(--green);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.btn:hover{background:var(--green-d)}
.btn[disabled]{background:#AEB6BE;cursor:default;box-shadow:none}
.btn svg{width:18px;height:18px}
.crumb{pointer-events:none;background:var(--white);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--sky-d);
  box-shadow:0 2px 8px rgba(0,0,0,.08);display:none}
#stage.is-zoomed .crumb{display:inline-block}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:999px;
  padding:8px 18px;font-size:15px;color:var(--ink2);box-shadow:0 2px 8px rgba(0,0,0,.08);white-space:nowrap;transition:opacity .3s}
#stage.is-zoomed .hint{opacity:0;pointer-events:none}

/* ---------- tooltip ---------- */
.tip{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;
  font-size:15px;line-height:1.45;max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:17px;color:var(--sky)}
.tip small{display:block;margin-top:4px;color:#C9D1D9;font-size:13px}

/* ---------- info cards ---------- */
.card{position:absolute;pointer-events:auto;width:var(--cw,280px);background:var(--white);border-radius:14px;
  border:2px solid transparent;box-shadow:0 4px 14px rgba(30,40,50,.12);padding:12px 14px 10px;cursor:pointer;
  opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,border-color .2s,top .25s;outline:none}
.card.show{opacity:1;transform:none}
.card:hover,.card:focus-visible{border-color:var(--sky)}
.card.hl{border-color:var(--green)}
.card h3{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px;line-height:1.3}
.card h3 .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sky);color:#fff;font-size:13px;display:grid;place-items:center}
.card h3 .more{margin-left:auto;font-size:13px;font-weight:700;color:var(--sky-d)}
.card ul{list-style:none;margin:8px 0 0;padding:0}
.card li{display:grid;grid-template-columns:20px 34px 1fr;gap:4px;align-items:start;font-size:15px;line-height:1.45;padding:3px 0;
  border-top:1px dashed #E3E7EB}
.card li:first-child{border-top:0}
.card li svg{width:18px;height:18px;margin-top:2px}
.card li b{font-size:13px;color:var(--ink2);font-weight:700;padding-top:1px}
.card.compact li.extra{display:none}
.ic-sight{color:var(--sky-d)} .ic-food{color:var(--green-d)} .ic-person{color:#6B7F95} .ic-event{color:#A77B2E}

#cardList.on{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:14px 16px 6px}
#cardList .card{position:static;width:auto}

/* ---------- panel ---------- */
.panel h2{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.01em}
.panel .lead{margin:0 0 16px;color:var(--ink2);font-size:15.5px}
.steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.steps li{position:relative;padding:10px 12px 10px 48px;background:var(--white);border-radius:12px;margin-bottom:8px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;
  background:var(--sky);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.notice{background:var(--green-l);border-left:5px solid var(--green);border-radius:10px;padding:12px 14px;font-size:15px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip-btn{border:2px solid var(--sky);background:var(--white);color:var(--sky-d);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:15px}
.chip-btn:hover{background:var(--sky);color:#fff}
.src{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:10px}

.tabs{display:flex;gap:6px;margin:14px 0 14px;background:#E2E6EA;border-radius:12px;padding:4px}
.tab{flex:1;white-space:nowrap;border:0;border-radius:9px;padding:9px 4px;background:transparent;font-weight:700;font-size:15px;color:var(--ink2);cursor:pointer}
.tab[aria-selected="true"]{background:var(--green);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tab .cnt{display:inline-block;min-width:20px;margin-left:4px;padding:0 5px;border-radius:999px;background:rgba(0,0,0,.08);font-size:13px}
.tab[aria-selected="true"] .cnt{background:rgba(255,255,255,.25)}
.q{background:var(--white);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;border:2px solid transparent;transition:border-color .2s}
.q.on{border-color:var(--green)}
.q .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.city{background:var(--sky-l);color:var(--sky-d)}
.tag.kind{background:var(--green-l);color:var(--green-d)}
.q .qtext{display:block;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer;font-size:16.5px;line-height:1.6;font-weight:600}
.q .qtext:hover{color:var(--sky-d)}
.q .qtext::before{content:"Q. ";color:var(--green);font-weight:800}
.q textarea{display:block;width:100%;margin-top:10px;min-height:64px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 11px;font:inherit;font-size:15.5px;background:#FAFBFC;color:var(--ink)}
.q textarea:focus{outline:none;border-color:var(--sky);background:#fff}
.empty{background:var(--white);border-radius:14px;padding:18px;color:var(--ink2);text-align:center}

/* ---------- detail dialog ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(640px,92vw);max-height:88vh;box-shadow:0 18px 50px rgba(0,0,0,.25);color:var(--ink)}
dialog::backdrop{background:rgba(38,44,51,.45)}
.dlg-head{position:sticky;top:0;background:var(--white);display:flex;align-items:center;gap:12px;padding:18px 22px 12px;border-bottom:3px solid var(--sky);z-index:1}
.dlg-head h2{margin:0;font-size:24px;font-weight:800}
.dlg-head .rg{color:var(--sky-d);font-weight:700;font-size:15px}
.dlg-head button{margin-left:auto;border:0;background:#E9EDF0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:22px;line-height:1}
.dlg-body{padding:16px 22px 22px}
.visual{display:flex;align-items:center;justify-content:center;gap:18px;background:linear-gradient(135deg,var(--sky-l),var(--green-l));
  border-radius:14px;height:150px;margin-bottom:14px;overflow:hidden}
.visual svg{width:54px;height:54px}
figure.photo{margin:0 0 14px}
figure.photo img{width:100%;max-height:300px;object-fit:cover;border-radius:14px;display:block}
figure.photo figcaption{font-size:12.5px;color:var(--ink2);margin-top:4px}
.sec{margin:0 0 14px}
.sec h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:17px}
.sec h3 svg{width:22px;height:22px}
.sec ul{margin:0;padding-left:22px}
.sec li{margin:2px 0}
.dlg-q{background:var(--panel);border-radius:12px;padding:12px 14px}
.dlg-q h3{margin:0 0 6px;font-size:16px;color:var(--green-d)}
.dlg-q ol{margin:0;padding-left:20px}
.dlg-q li{margin:4px 0;font-size:15.5px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</svg>

<header class="top">
  <div class="logo"><svg><use href="#i-book"/></svg></div>
  <div>
    <h1>우리나라 지리와 함께 탐구하는 우리말 문법 현상</h1>
    <p>지역의 명소·음식·인물·역사 속 낱말로 음운 변동, 단어의 짜임, 품사를 탐구해 봅시다.</p>
  </div>
</header>

<main>
  <section class="mapcol">
    <div id="stage">
      <svg id="map" role="group" aria-label="대한민국 지도. 지역권을 선택하세요."></svg>
      <svg id="overlay" aria-hidden="false"></svg>
      <div id="cards"></div>
      <div class="stagebar">
        <button class="btn" id="back" disabled><svg><use href="#i-back"/></svg>전체 지도로 돌아가기</button>
        <span class="crumb" id="crumb"></span>
      </div>
      <div class="hint" id="hint">지역권 위에 마우스를 올리고, 눌러서 확대해 보세요</div>
      <div class="tip" id="tip" role="status" aria-live="polite"></div>
    </div>
    <div id="cardList"></div>
  </section>
  <aside class="panel" aria-label="문법 탐구 질문">
    <div class="panel-scroll" id="panel"></div>
  </aside>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

];

const TABS = ["음운 변동","단어의 짜임","품사"];
const CATS = [
  {key:"sights", label:"명소", full:"관광 명소", icon:"i-sight", cls:"ic-sight"},
  {key:"food",   label:"음식", full:"대표 음식", icon:"i-food",  cls:"ic-food"},
  {key:"people", label:"인물", full:"유명 인물", icon:"i-person",cls:"ic-person"},
  {key:"events", label:"사건", full:"역사적 사건", icon:"i-event", cls:"ic-event"}];
// 겹쳐 그리는 순서 (서울·인천을 맨 위에)
const ORDER = ["jeju","honam","yeongnam","chungcheong","gangwon","gyeonggi","incheon","seoul"];

/* ---------- 준비 ---------- */
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const stage = $("#stage"), map = $("#map"), overlay = $("#overlay"), cardsBox = $("#cards"),
      cardList = $("#cardList"), panel = $("#panel"), tip = $("#tip"), backBtn = $("#back"),
      crumb = $("#crumb"), dlg = $("#dlg");
const RG = {}; REGIONS.forEach(r => RG[r.id] = r);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const memo = {};                 // 메모 (저장하지 않고 화면을 연 동안만 유지)
const state = {vb:null, sel:null, lifted:null, tab:TABS[0], raf:0, ptype:"mouse", hl:[]};

const proj = (lon, lat) => [(lon - GEO.proj.lon0) * GEO.proj.kx, (GEO.proj.lat0 - lat) * GEO.proj.ky];
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = s => { const t = s.replace(/\s*\([^)]*\)/g, "").trim(); return t || s.replace(/[()]/g, ""); };
const icon = (id, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

REGIONS.forEach(r => {
  r.cities.forEach((c, i) => { c.region = r.id; c.idx = i; [c.x, c.y] = proj(c.lon, c.lat); });
  r.qs = r.questions.map((q, i) => {
    const tabs = q[1].split("·");
    let names = q[0] ? r.cities.filter(c => c.name === q[0] || c.group === q[0]).map(c => c.name) : [r.cities[0].name];
    return {id: r.id + "-" + i, label: q[0] || r.name, tabs, kind: q[1], text: q[2], cities: names};
  });
});

/* ---------- 지도 그리기 ---------- */
const defs = el("defs", {}, map);
const f = el("filter", {id:"lift-shadow", x:"-20%", y:"-20%", width:"140%", height:"160%"}, defs);
el("feDropShadow", {dx:0, dy:3, stdDeviation:3, "flood-color":"#1d3a4a", "flood-opacity":.35}, f);
const regionsLayer = el("g", {id:"regions"}, map);
const labelsLayer = el("g", {id:"labels"}, map);
const gEl = {};

ORDER.forEach(id => {
  const r = RG[id], geo = GEO.regions[id];
  const g = el("g", {class:"region", "data-id":id, tabindex:0, role:"button",
    "aria-label": `${r.name} 지역권: ${r.cities.map(c => c.name).join(", ")}`}, regionsLayer);
  const base = el("g", {class:"base"}, g), top = el("g", {class:"top"}, g);
  geo.paths.forEach(p => { el("path", {d:p.d, "fill-rule":"evenodd"}, base);
    const t = el("path", {d:p.d, "fill-rule":"evenodd"}, top); el("title", {}, t).textContent = `${r.name} · ${p.name}`; });
  if (id === "yeongnam") {      // 독도
    const [dx, dy] = GEO.dokdo;
    el("circle", {cx:dx, cy:dy, r:1.6}, base).style.fill = "var(--map-side)";
    el("circle", {class:"dokdo", cx:dx - 0.8, cy:dy, r:1.6}, top);
    el("circle", {class:"dokdo", cx:dx + 1.3, cy:dy + 0.2, r:1.3}, top);
  }
  if (id === "seoul" || id === "incheon") {   // 작은 지역은 인식 범위를 넓게
    const [hx, hy] = id === "seoul" ? proj(126.99, 37.56) : proj(126.62, 37.47);
    el("circle", {class:"hit", cx:hx, cy:hy, r: id === "seoul" ? 17 : 15}, top);
  }
  gEl[id] = g;
  const [lx, ly] = proj(...r.label);
  const t = el("text", {class:"rlabel", x:lx, y:ly, "font-size": (id === "seoul" || id === "incheon") ? 13 : 17}, labelsLayer);
  t.textContent = r.name;
});
[["울릉도", 130.86, 37.40], ["독도", 131.87, 37.17]].forEach(([n, lon, lat]) => {
  const [x, y] = proj(lon, lat);
  const t = el("text", {class:"small", x, y, "font-size":10}, labelsLayer); t.textContent = n;
});
const reorder = () => ORDER.forEach(id => regionsLayer.appendChild(gEl[id]));

/* ---------- 화면 좌표 ---------- */
const size = () => [stage.clientWidth, stage.clientHeight];
const isWide = () => stage.clientWidth >= 720;
function toScreen(x, y) { const [vx, vy, vw, vh] = state.vb, [W, H] = size(); return [(x - vx) / vw * W, (y - vy) / vh * H]; }
function fitBox(box, left, right, top, bottom) {
  const [W, H] = size(); let [x0, y0, x1, y1] = box;
  const minS = 70; if (x1 - x0 < minS) { const c = (x0 + x1) / 2; x0 = c - minS / 2; x1 = c + minS / 2; }
  if (y1 - y0 < minS) { const c = (y0 + y1) / 2; y0 = c - minS / 2; y1 = c + minS / 2; }
  const aw = Math.max(80, W - left - right), ah = Math.max(80, H - top - bottom);
  const s = Math.min(aw / (x1 - x0), ah / (y1 - y0));
  const sx = left + aw / 2, sy = top + ah / 2, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return [cx - sx / s, cy - sy / s, W / s, H / s];
}
const overviewVB = () => fitBox(GEO.extent, 20, 20, 70, 64);
function regionVB(id) {
  const side = isWide() ? cardWidth() + 40 : 14;
  return fitBox(GEO.regions[id].bbox, side, side, 70, 24);
}
const cardWidth = () => Math.round(Math.min(300, Math.max(230, stage.clientWidth * 0.22)));
function applyVB() { map.setAttribute("viewBox", state.vb.join(" ")); drawOverlay(); }
function animateVB(to, done) {
  cancelAnimationFrame(state.raf);
  if (reduceMotion || !state.vb) { state.vb = to; applyVB(); done && done(); return; }
  const from = state.vb.slice(), t0 = performance.now(), dur = 650;
  const step = t => { let k = Math.min(1, (t - t0) / dur); k = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    state.vb = from.map((v, i) => v + (to[i] - v) * k); applyVB();
    if (k < 1) state.raf = requestAnimationFrame(step); else done && done(); };
  state.raf = requestAnimationFrame(step);
}

/* ---------- 솟아오르기 ---------- */
function lift(id) {
  if (state.lifted === id) return; unlift(true);
  state.lifted = id; const g = gEl[id];
  const d = 9 * state.vb[2] / stage.clientWidth;          // 화면에서 약 9px
  g.querySelector(".top").style.transform = `translate(0px, ${-d}px)`;
  g.classList.add("lift"); regionsLayer.appendChild(g);
}
function unlift(keepTip) {
  const id = state.lifted; if (!id) return; state.lifted = null;
  const g = gEl[id]; g.classList.remove("lift"); g.querySelector(".top").style.transform = "";
  setTimeout(() => { if (state.lifted !== id) reorder(); }, 300);
  if (!keepTip) hideTip();
}
function showTip(id, ev) {
  const r = RG[id], touch = state.ptype !== "mouse";
  tip.innerHTML = `<b>${r.name}</b>${r.cities.map(c => c.name).join(" · ")}<small>${state.sel ? "눌러서 이 지역권으로 이동" : touch ? "한 번 더 누르면 확대돼요" : "눌러서 확대해 보세요"}</small>`;
  tip.classList.add("on"); moveTip(ev, id);
}
function moveTip(ev, id) {
  const rect = stage.getBoundingClientRect(); let x, y;
  if (ev && ev.clientX != null && state.ptype === "mouse") { x = ev.clientX - rect.left + 16; y = ev.clientY - rect.top + 16; }
  else { const b = GEO.regions[id].bbox; [x, y] = toScreen((b[0] + b[2]) / 2, b[1]); y = Math.max(60, y - 70); x -= 60; }
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, x), rect.width - w - 8) + "px";
  tip.style.top = Math.min(Math.max(8, y), rect.height - h - 8) + "px";
}
const hideTip = () => tip.classList.remove("on");

map.addEventListener("pointerdown", e => { state.ptype = e.pointerType || "mouse"; state.kbd = false; });
Object.entries(gEl).forEach(([id, g]) => {
  g.addEventListener("pointerenter", e => { if (e.pointerType !== "mouse") return; state.ptype = "mouse";
    if (!state.sel) lift(id); if (state.sel !== id) showTip(id, e); });
  g.addEventListener("pointermove", e => { if (e.pointerType === "mouse" && tip.classList.contains("on")) moveTip(e, id); });
  g.addEventListener("pointerleave", e => { if (e.pointerType !== "mouse") return; if (!state.sel) unlift(); else hideTip(); });
  g.addEventListener("click", () => {
    if (state.sel === id) return;
    if (state.sel) { select(id); return; }
    if (state.ptype !== "mouse" && state.lifted !== id) { lift(id); showTip(id); return; }   // 터치: 첫 탭은 솟아오르기
    select(id);
  });
  g.addEventListener("focus", () => { if (!state.sel && g.matches(":focus-visible")) { state.kbd = true; lift(id); showTip(id); } });
  g.addEventListener("blur", () => { if (state.kbd && !state.sel) { state.kbd = false; unlift(); } });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (state.sel !== id) select(id); } });
});
map.addEventListener("click", e => { if (!e.target.closest(".region") && !state.sel) unlift(); });

/* ---------- 지역권 선택 / 돌아가기 ---------- */
function select(id) {
  unlift(); hideTip(); state.sel = id; state.hl = [];
  map.classList.add("zoomed"); stage.classList.add("is-zoomed");
  Object.entries(gEl).forEach(([k, g]) => g.classList.toggle("active", k === id));
  backBtn.disabled = false; crumb.textContent = `${RG[id].name} 지역권`;
  clearCards(); state.tab = TABS.find(t => RG[id].qs.some(q => q.tabs.includes(t))) || TABS[0];
  renderPanel();
  animateVB(regionVB(id), renderCards);
}
function goHome() {
  state.sel = null; state.hl = []; clearCards();
  map.classList.remove("zoomed"); stage.classList.remove("is-zoomed");
  Object.values(gEl).forEach(g => g.classList.remove("active"));
  backBtn.disabled = true; renderPanel(); animateVB(overviewVB());
}
backBtn.addEventListener("click", goHome);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.sel && !dlg.open) goHome(); });

/* ---------- 마커와 지시선 ---------- */
let cardPos = [];   // 지시선을 그릴 카드 위치
function drawOverlay() {
  overlay.innerHTML = "";
  if (!state.sel) return;
  const r = RG[state.sel], showNames = !isWide();
  const lines = el("g", {}, overlay), marks = el("g", {}, overlay);
  r.cities.forEach((c, i) => {
    const [x, y] = toScreen(c.x, c.y);
    const cp = cardPos[i];
    if (cp) {
      const ax = cp.side === "left" ? cp.x + cp.w : cp.x;
      const ay = Math.min(Math.max(y, cp.y + 18), cp.y + cp.h - 18);
      el("path", {class:"leader", d:`M${x},${y}L${ax},${ay}`}, lines);
      el("circle", {class:"leader-dot", cx:ax, cy:ay, r:3.5}, lines);
    }
    const g = el("g", {class:"marker" + (state.hl.includes(c.name) ? " hl" : ""), "data-city":c.name, tabindex:0,
      role:"button", "aria-label":`${c.name} 자세히 보기`}, marks);
    el("circle", {class:"pulse", cx:x, cy:y, r:12}, g);
    el("circle", {class:"m", cx:x, cy:y, r:12}, g);
    const n = el("text", {class:"n", x, y}, g); n.textContent = i + 1;
    if (showNames) { const t = el("text", {class:"mname", x:x + 16, y}, g); t.textContent = c.name; }
    g.addEventListener("click", () => openCity(c));
    g.addEventListener("keydown", e => { if (e.key === "Enter") openCity(c); });
  });
}

/* ---------- 정보 카드 ---------- */
function cardHTML(c, n) {
  const rows = CATS.map((k, j) => {
    const list = c[k.key], shown = list.slice(0, 2).map(short).join(" · ");
    const more = list.length > 2 ? ` 외 ${list.length - 2}` : "";
    return `<li class="${j > 1 ? "extra" : ""}">${icon(k.icon, k.cls)}<b>${k.label}</b><span>${esc(shown)}${more}</span></li>`;
  }).join("");
  return `<h3><span class="num">${n}</span>${esc(c.name)}<span class="more">자세히 ›</span></h3><ul>${rows}</ul>`;
}
function clearCards() { cardsBox.innerHTML = ""; cardList.innerHTML = ""; cardList.classList.remove("on"); cardPos = []; drawOverlay(); }
function renderCards() {
  if (!state.sel) return;
  const r = RG[state.sel], wide = isWide(); cardsBox.innerHTML = ""; cardList.innerHTML = ""; cardPos = [];
  const box = wide ? cardsBox : cardList; cardList.classList.toggle("on", !wide);
  const els = r.cities.map((c, i) => {
    const a = document.createElement("article");
    a.className = "card" + (state.hl.includes(c.name) ? " hl" : ""); a.tabIndex = 0; a.dataset.city = c.name;
    a.setAttribute("role", "button"); a.setAttribute("aria-label", `${c.name} 정보 자세히 보기`);
    a.innerHTML = cardHTML(c, i + 1); if (wide) a.style.setProperty("--cw", cardWidth() + "px");
    a.addEventListener("click", () => openCity(c));
    a.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCity(c); } });
    box.appendChild(a); return a;
  });
  if (wide) layoutCards(r, els);
  drawOverlay();
  requestAnimationFrame(() => els.forEach((a, i) => setTimeout(() => a.classList.add("show"), reduceMotion ? 0 : i * 60)));
}
function layoutCards(r, els) {
  const [W, H] = size(), cw = cardWidth(), top = 70, bottom = H - 14, gap = 10, pad = 16;
  const idx = r.cities.map((c, i) => i);
  const scr = r.cities.map(c => toScreen(c.x, c.y));
  let left = [], right = [];
  if (idx.length === 1) right = idx;
  else { const byX = idx.slice().sort((a, b) => scr[a][0] - scr[b][0]); const k = Math.floor(idx.length / 2);
    left = byX.slice(0, k); right = byX.slice(k); }
  const place = (col, side) => {
    col.sort((a, b) => scr[a][1] - scr[b][1]);
    let hs = col.map(i => els[i].offsetHeight);
    if (hs.reduce((s, h) => s + h + gap, -gap) > bottom - top) { col.forEach(i => els[i].classList.add("compact")); hs = col.map(i => els[i].offsetHeight); }
    const ys = []; let cur = top;
    col.forEach((i, j) => { const ideal = scr[i][1] - hs[j] / 2; ys[j] = Math.max(ideal, cur); cur = ys[j] + hs[j] + gap; });
    let limit = bottom;
    for (let j = col.length - 1; j >= 0; j--) { ys[j] = Math.max(top, Math.min(ys[j], limit - hs[j])); limit = ys[j] - gap; }
    const x = side === "left" ? pad : W - pad - cw;
    col.forEach((i, j) => { els[i].style.left = x + "px"; els[i].style.top = ys[j] + "px";
      cardPos[i] = {x, y: ys[j], w: cw, h: hs[j], side}; });
  };
  place(left, "left"); place(right, "right");
}

/* ---------- 탐구 질문 패널 ---------- */
function renderPanel() {
  if (!state.sel) {
    panel.innerHTML = `
      <h2>탐구 방법</h2>
      <p class="lead">지도 속 지역을 둘러보며 낱말의 소리와 짜임을 스스로 탐구해 봅시다.</p>
      <ol class="steps">
        <li>지도에서 <b>지역권 위에 마우스를 올려</b> 보세요. 지역권이 솟아오릅니다. (태블릿은 한 번 누르기)</li>
        <li><b>눌러서 확대</b>하면 도시별 명소·음식·인물·역사 카드가 나타납니다.</li>
        <li>카드를 누르면 도시의 전체 설명을 볼 수 있습니다.</li>
        <li>오른쪽 <b>문법 탐구 질문</b>을 읽고, 소리 내어 읽거나 사전을 찾아보며 생각을 메모해 보세요.</li>
      </ol>
      <p class="notice">이 앱은 정답을 알려 주지 않습니다. 교과서와 국어사전(표준국어대사전 등)을 찾아보며 친구들과 생각을 나누어 보세요.</p>
      <h2 style="font-size:18px">바로 가기</h2>
      <div class="chips">${REGIONS.map(r => `<button class="chip-btn" data-go="${r.id}">${r.name}</button>`).join("")}</div>
      <p class="src">지도 경계: 통계청 2013년 시·도 경계(southkorea-maps 공개 데이터)를 단순화하여 사용했습니다. 독도는 실제 위치에 따로 표시했습니다. 2026년 7월 출범한 전남광주통합특별시는 옛 광주광역시·전라남도 범위로 호남권에 함께 표시됩니다.</p>`;
    panel.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => select(b.dataset.go)));
    return;
  }
  const r = RG[state.sel];
  const counts = TABS.map(t => r.qs.filter(q => q.tabs.includes(t)).length);
  const list = r.qs.filter(q => q.tabs.includes(state.tab));
  panel.innerHTML = `
    <h2>${r.name} · 문법 탐구 질문</h2>
    <p class="lead">${esc(r.desc)}</p>
    <div class="tabs" role="tablist" aria-label="탐구 영역">
      ${TABS.map((t, i) => `<button class="tab" role="tab" aria-selected="${t === state.tab}" data-tab="${t}">${t}<span class="cnt">${counts[i]}</span></button>`).join("")}
    </div>
    <div role="tabpanel" aria-label="${state.tab} 질문">
      ${list.length ? list.map(q => `
        <div class="q${q.cities.some(c => state.hl.includes(c)) && state.hlq === q.id ? " on" : ""}" data-q="${q.id}">
          <div class="meta"><span class="tag city">${esc(q.label)}</span>${q.tabs.map(t => `<span class="tag kind">${t}</span>`).join("")}</div>
          <button class="qtext" data-q="${q.id}" title="눌러서 지도에서 위치 보기">${esc(q.text)}</button>
          <label class="sr" for="m-${q.id}">메모</label>
          <textarea id="m-${q.id}" data-q="${q.id}" placeholder="내 생각을 적어 보세요 (저장되지 않아요)">${esc(memo[q.id] || "")}</textarea>
        </div>`).join("")
      : `<div class="empty">${r.name} 지역권에는 '${state.tab}' 탐구 질문이 없어요.<br>다른 탭이나 다른 지역권을 살펴보세요.</div>`}
    </div>
    <p class="notice" style="margin-top:6px">답은 알려 주지 않아요. 소리 내어 읽어 보고, 사전과 교과서에서 근거를 찾아 설명해 보세요.</p>`;
  panel.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; renderPanel(); }));
  panel.querySelectorAll("textarea").forEach(t => t.addEventListener("input", () => memo[t.dataset.q] = t.value));
  panel.querySelectorAll(".qtext").forEach(b => b.addEventListener("click", () => highlight(r.qs.find(q => q.id === b.dataset.q))));
}
function highlight(q) {
  state.hl = q.cities; state.hlq = q.id;
  panel.querySelectorAll(".q").forEach(d => d.classList.toggle("on", d.dataset.q === q.id));
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("hl", q.cities.includes(c.dataset.city)));
  drawOverlay();
  if (!isWide()) stage.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "center"});
}

/* ---------- 도시 상세 보기 ---------- */
function openCity(c) {
  const r = RG[c.region];
  const qs = r.qs.filter(q => q.cities.includes(c.name));
  const visual = c.photo && c.photo.src
    ? `<figure class="photo"><img src="${esc(c.photo.src)}" alt="${esc(c.name)} 사진" onerror="this.closest('figure').outerHTML=document.getElementById('fallback-visual').innerHTML">
         <figcaption>출처: ${esc(c.photo.source || "")} · 저작자: ${esc(c.photo.author || "")} · ${esc(c.photo.license || "")}</figcaption></figure>`
    : fallbackVisual();
  dlg.innerHTML = `
    <div class="dlg-head"><div><div class="rg">${r.name} 지역권</div><h2 id="dlgTitle">${esc(c.name)}</h2></div>
      <button aria-label="닫기" id="dlgClose">×</button></div>
    <div class="dlg-body">
      ${visual}
      ${CATS.map(k => `<section class="sec"><h3>${icon(k.icon, k.cls)}${k.full}</h3><ul>${c[k.key].map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>`).join("")}
      ${qs.length ? `<div class="dlg-q"><h3>이 도시와 관련된 탐구 질문</h3><ol>${qs.map(q => `<li>${esc(q.text)}</li>`).join("")}</ol></div>` : ""}
    </div>`;
  $("#dlgClose").addEventListener("click", () => dlg.close());
  dlg.showModal();
}
function fallbackVisual() { return document.getElementById("fallback-visual").innerHTML; }
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
const fb = document.createElement("template"); fb.id = "fallback-visual";
fb.innerHTML = `<div class="visual">${CATS.map(k => icon(k.icon, k.cls)).join("")}</div>`;
document.body.appendChild(fb);

/* ---------- 시작 / 크기 변경 ---------- */
function relayout() {
  cancelAnimationFrame(state.raf);
  state.vb = state.sel ? regionVB(state.sel) : overviewVB(); applyVB();
  if (state.sel) renderCards();
}
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(relayout, 80); }).observe(stage);
state.vb = overviewVB(); applyVB(); renderPanel();
</script>
</body>
</html>
